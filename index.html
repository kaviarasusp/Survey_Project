<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A4U Survey Builder</title>
  <meta name="description" content="Demo of the A4U survey builder: create surveys from the question library, edit their questions and tag clients, with data stored as XML.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=9">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <span class="brand-name">A4U Surveys</span>
      <span class="demo-tag">Demo</span>
    </div>
    <div class="topbar-right">
      <label class="tenant">
        <span>Signed in as</span>
        <select id="tenant-select" aria-label="Signed in as"></select>
      </label>
      <span id="storage-badge" class="storage-badge" role="status"></span>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button type="button" role="tab" id="tab-btn-survey" aria-controls="tab-survey" aria-selected="true" data-tab="survey">New survey</button>
    <button type="button" role="tab" id="tab-btn-surveys" aria-controls="tab-surveys" aria-selected="false" data-tab="surveys">Surveys</button>
    <button type="button" role="tab" id="tab-btn-questions" aria-controls="tab-questions" aria-selected="false" data-tab="questions">Question library</button>
    <button type="button" role="tab" id="tab-btn-admin" aria-controls="tab-admin" aria-selected="false" data-tab="admin">Settings</button>
    <button type="button" role="tab" id="tab-btn-data" aria-controls="tab-data" aria-selected="false" data-tab="data">XML data</button>
  </nav>

  <div id="mode-banner" class="banner" hidden></div>

  <main>
    <section id="tab-survey" class="tab" role="tabpanel" aria-labelledby="tab-btn-survey"></section>
    <section id="tab-surveys" class="tab" role="tabpanel" aria-labelledby="tab-btn-surveys" hidden></section>
    <section id="tab-questions" class="tab" role="tabpanel" aria-labelledby="tab-btn-questions" hidden></section>
    <section id="tab-admin" class="tab" role="tabpanel" aria-labelledby="tab-btn-admin" hidden></section>
    <section id="tab-data" class="tab" role="tabpanel" aria-labelledby="tab-btn-data" hidden></section>
    <div id="loading" class="loading">Loading XML data…</div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/seed-data.js?v=9"></script>
  <script src="js/store.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
